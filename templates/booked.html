<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>booked</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/static/src/output.css" />
  </head>
  <body>
    <div class="h-screen flex items-center justify-center">
      <div class="text-center border p-20 rounded-md shadow-lg">
        <div
          class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6"
        >
          <i class="fa-solid fa-check text-green-600 text-5xl"></i>
        </div>

        <h1 class="text-2xl font-bold text-gray-800 mb-3">
          Appointment Booked Successfully!
        </h1>

        <p class="text-gray-500 text-base mb-8">
          Your appointment has been confirmed.
        </p>

        <a
          href="/finddoctor"
          class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-7 py-3 rounded-lg transition duration-300"
        >
          <i class="fa-solid fa-arrow-left mr-2"></i>
          Back to Home
        </a>
      </div>
    </div>
  </body>
</html>
