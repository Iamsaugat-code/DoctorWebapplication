

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account</title>
      <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/static/src/output.css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class=" h-screen w-screen bg-cyan-300 py-8 flex items-center justify-center">
        <form action="{{url_for('new_account')}}" method="post" class="py-[50px] mt-4 px-[50px] w-[30%] pb-[60px]  bg-white border rounded-md shadow-lg shadow-green-600"">
         <div class="p-[10px] pt-[10px] text-center">
             <h1 class="text-3xl font-bold text-gray-800 mt-5 pb-[10px]">
                Create New Account
            </h1>
             <p class="text-gray-500  text-[15px]">
                for continue to web Application
            </p>
            <div class="w-full flex items-center justify-center gap-3">
              <hr class="w-[30%] h-[2px] bg-cyan-300">
              <i class="fa-solid fa-heart-pulse text-cyan-700 text-3xl"></i>
               <hr class="w-[30%] h-[2px] bg-cyan-300">
            </div>
        </div>
          {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category,message in messages %}
          {% if category =="error" %}
          <div class=" text-[15px] text-red-500 flex items-center justify-center gap-3  ">
            <i class="fa-solid fa-circle-exclamation"></i>
            {{message}}
          </div>
          {% endif %}
          {% endfor %}
          {% endwith %}


        <div class="mt-3 ">
          
             <div class="mt-3">
              <div class="flex items-center gap-3">
                <i class="fa-solid fa-envelope mt-1 text-red-400"></i>
                <h3 class="mt-1 font-serif">Gmail\emali</h3>
              </div>
              <div class="bg-white mt-2 px-3 py-2 border-[2px] border-slate-200 rounded-md flex items-center justify-center gap-1 {{ 'border-red-300' if feild_e=='gmail' else  'border-slate-200' }}">
              <input
                type="text"
                name="email"
                required value="{{request.form.get('email','')}}"
                placeholder="Enter the Gmail"
                autocomplete="off"
                class="w-full  outline-none"
              />
              <div>
                <i class="fa-solid fa-envelope  text-slate-400"></i>
              </div>
              </div>
            </div>

            <div class="w-full">
          <div class="mt-4 flex items-center gap-3">
            <i class="fa-solid fa-lock text-sky-600"></i>
            <h3 class="text-[16px]">Password</h3>
          </div>
            <div class= "bg-white mt-2 py-2 px-3 border-[2px] border-slate-200 rounded-md flex items-center justify-center gap-1 ">
              <input
                type="password"
                id="password"
                name="password"
                required value="{{request.form.get('password','')}}"
                class="text-black  bg-white w-full outline-none"
                placeholder=" Enter the password"
                autocomplete="off" /> 
                <div>   
               <button class="" type="button" id="lock">
                <i class="fa-solid fa-eye-slash  text-gray-400 "></i>
                </button>
              </div>
            </div>
            </div>
          </div>
            <div class="flex items-center justify-center">
            <button class="mt-10 px-8 py-3 rounded-2xl bg-red-600 hover:bg-red-700 shadow-2xl text-white font-semibold flex items-center justify-center gap-3"><i class="fa-solid fa-user-plus"></i> <span>Send verification code</span> <i class="fa-solid fa-arrow-right mt-1"></i> </button>
        </div>
        <div class="mt-2 flex items-center justify-center gap-4">
          <hr class="w-[30%] bg-sky-200 h-[2px]">
          <h2>or</h2>
          <hr class="w-[30%] bg-sky-200 h-[2px]">
        </div>
        <a href="{{url_for('login')}}" class=" mt-2 text-blue-500 flex items-center justify-center gap-2">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
           <span>I already have an account </span> </a>
      </form>
    </div>
    <script src="/static/lock.js"></script>
</body>
</html>
